<body>
<div class="wrap"><div class="card">
    <div class="brand">HYDRA FIREGUARD</div>
    <div class="sub">Low ping &nbsp;·&nbsp; Lag fix &nbsp;·&nbsp; High reg</div>

    <button class="btn" onclick="generate()">Generate WireGuard Config</button>
    <textarea id="config" readonly spellcheck="false" placeholder="Press Generate to create a config..."></textarea>
    <div class="row">
        <button class="btn btn-outline" onclick="copyConfig()">Copy Config</button>
        <button class="btn btn-outline" onclick="saveConfig()">Save Config</button>
    </div>

    <a class="tg" href="https://t.me/HYDRAx379_Official" target="_blank" rel="noopener">
        <span class="tg-icon">&#9992;</span>
        <span class="tg-text"><b>Join our Telegram channel</b><small>@HYDRAx379_Official</small></span>
        <span class="tg-go">Join</span>
    </a>

    <div class="footnote">Created by HYDRA</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const FAST_DNS = [
    ["Shecan",  "v4",   "178.22.122.100"],
    ["Electro", "v4",   "78.157.42.100"],
    ["Electro", "v4-2", "78.157.42.101"],
    ["Quad9",   "v4-2", "149.112.112.112"],
    ["Shecan",  "v4-2", "185.51.200.2"],
];
const ENDPOINT_PORT = 995, KEEPALIVE = 15;
const HEX_NO_ZERO = "123456789abcdef";
const HEXDIGITS = "0123456789abcdefabcdef";   // same distribution as the Python version

// ---------- helpers
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = s => s[randInt(0, s.length - 1)];
const pickN = (s, n) => Array.from({ length: n }, () => pick(s)).join("");
const hex = n => n.toString(16);

function ipv4ToInt(ip) { return ip.split(".").reduce((a, o) => a * 256 + Number(o), 0); }
function intToIpv4(n) { return [24, 16, 8, 0].map(s => Math.floor(n / 2 ** s) % 256).join("."); }

// groups: 8 numbers (0-65535) -> compressed IPv6 text (like Python's .compressed)
function ipv6(groups) {
    let best = [-1, 0], i = 0;
    while (i < 8) {
        if (groups[i] === 0) {
            let j = i; while (j < 8 && groups[j] === 0) j++;
            if (j - i > best[1]) best = [i, j - i];
            i = j;
        } else i++;
    }
    const h = groups.map(hex);
    if (best[1] < 2) return h.join(":");
    return h.slice(0, best[0]).join(":") + "::" + h.slice(best[0] + best[1]).join(":");
}
const randGroups = n => Array.from({ length: n }, () => randInt(0, 65535));

// ---------- address generators
const KABIR_V4 = [["37.236.0.0", 2 ** 18], ["109.224.0.0", 2 ** 16], ["5.44.0.0", 2 ** 17]];
function ipv4Kabir() {
    const [base, size] = KABIR_V4[randInt(0, KABIR_V4.length - 1)];
    return intToIpv4(ipv4ToInt(base) + randInt(0, size - 1));
}
const KABIR_V6 = [[0x2a02, 0x74], [0x2a03, 0x100]];
function ipv6Kabir() { const [a, b] = KABIR_V6[randInt(0, 1)]; return ipv6([a, b, ...randGroups(6)]); }

const ipv4_95 = () => `95.141.${randInt(0, 255)}.${randInt(0, 127) * 2}`;
const ipv4_188 = () => `188.74.${randInt(0, 255)}.${randInt(0, 255)}`;
const ipv6Custom = () => `2a07:a8c0::1${pick("abcdef")}:${pickN(HEX_NO_ZERO, 4)}`;
function ipv6OldPair() {
    const s1 = pickN(HEXDIGITS, 3), s2 = randInt(100, 999), s3 = hex(randInt(0, 65535));
    return [`ba1c:${s1}:2001:${s2}:${s3}::0`, `ba1c:${s1}:2001:${s2 + 1}:${s3}::1`];
}
function ipv6Db8Pair() {
    const seg = hex(randInt(0, 65535));
    return [`2001:db8:85a3:0:${seg}::`, `2001:db8:85a3:1:${seg}::`];
}
const ipv6PaladinPair = () => [0, 1].map(() => ipv6([0x329c, 0x1a40, 0, 4, ...randGroups(4)]));
const address = () => `${randInt(1, 99)}.0.${randInt(1, 99)}.10/32, c0f1:${pickN(HEX_NO_ZERO, 4)}:${pickN(HEX_NO_ZERO, 3)}:1234::0/128`;

function key() {
    const b = crypto.getRandomValues(new Uint8Array(32));
    return btoa(String.fromCharCode(...b));
}

// ---------- config
function buildConfig() {
    const [oldA, oldB] = ipv6OldPair(), [dbA, dbB] = ipv6Db8Pair(), [palA, palB] = ipv6PaladinPair();
    const dns = [
        ipv4_95(), ipv4_188(),                       // random IPv4 first
        ...FAST_DNS.map(d => d[2]),                  // then the fast DNS
        ipv6Custom(), ipv6Custom(), oldA, oldB, ipv6Kabir(), ipv6Kabir(), dbA, dbB, palA, palB,
    ];
    return "[Interface]\n" +
        `PrivateKey = ${key()}\n` +
        `Address = ${address()}\n` +
        `DNS = ${dns.join(", ")}\n` +
        "[Peer]\n" +
        `PublicKey = ${key()}\n` +
        `Endpoint = ${ipv4Kabir()}:${ENDPOINT_PORT}\n` +
        `PersistentKeepalive = ${KEEPALIVE}\n`;
}

// ---------- UI
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
}
function generate() { document.getElementById("config").value = buildConfig(); }
const current = () => document.getElementById("config").value.trim();

function copyConfig() {
    const text = current();
    if (!text) return toast("Generate a config first");
    const fallback = () => {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        toast("Config copied");
    };
    if (navigator.clipboard && window.isSecureContext)
        navigator.clipboard.writeText(text).then(() => toast("Config copied")).catch(fallback);
    else fallback();
}

// Hosted pages must save through the viewer's "downloads" capability (allowed
// extensions include txt and zip, not conf). Opened as a normal file, it falls
// back to a plain browser download.
async function getDownloads() {
    try { return (window.claude && claude.use) ? await claude.use("downloads") : null; }
    catch (e) { return null; }
}

async function saveFile(hostedName, data, ext) {
    const dl = await getDownloads();
    if (dl) {   // hosted version: fixed allowed name, no prompt
        try { await dl.save({ filename: hostedName, data }); toast("Saved " + hostedName); }
        catch (e) { if (!e || e.code !== "declined") toast("Could not save the file"); }
        return;
    }
    // normal website / local file: ask for the file name, then download
    let base = prompt("File name (without extension):", "fireguard");
    if (base === null) return;   // cancelled
    base = base.trim().replace(/\.(conf|zip|txt)$/i, "").replace(/[^A-Za-z0-9_=+.-]/g, "").slice(0, 15) || "fireguard";
    const fname = base + "." + ext;
    const a = document.createElement("a");
    // octet-stream stops Android from appending ".txt" to the name
    a.href = URL.createObjectURL(new Blob([data], { type: "application/octet-stream" }));
    a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Saved " + fname);
}

function saveConfig() {
    const text = current();
    if (!text) return toast("Generate a config first");
    saveFile("fireguard.txt", text + "\n", "conf");
}

</script>
